services:
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD in deployment/.env}
      NODE_ENV: production
      POSTGRES_CONNECTION_STRING: postgresql://tally:${DB_PASSWORD}@db:5432/tally
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "7856:3000"
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: tally
      POSTGRES_USER: tally
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tally"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
