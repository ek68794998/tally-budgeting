name: Initialize environment
description: "Installs required build tools and prepares environment for build"

runs:
  using: "composite"
  steps:
    - name: Install PNPM
      uses: pnpm/action-setup@v6

    - name: Install Node.js
      uses: actions/setup-node@v7
      with:
        cache: pnpm
        node-version: "22.x"

    - name: Install modules
      run: pnpm i
      shell: bash

    - name: Print diagnostics
      run: pnpm diagnostic
      shell: bash
