name: Pull request gated build

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ github.repository }}

# Jobs run on separate runners so that memory-heavy steps (PGlite database
# tests, the Docker build) don't compete.

jobs:
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Initialize environment
        uses: ./.github/actions/setup

      - parallel:
        - name: Lint
          uses: ./.github/actions/lint

        - name: Check types
          uses: ./.github/actions/type-check

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Initialize environment
        uses: ./.github/actions/setup

      - name: Unit tests
        uses: ./.github/actions/test

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build Docker image
        uses: ./.github/actions/build-docker
